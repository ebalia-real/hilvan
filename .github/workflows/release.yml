# Compila Hilvan para Linux, Windows y macOS al publicar una etiqueta vX.Y.Z y deja todo en una
# versión BORRADOR. scripts/publicar.sh le agrega el APK (firmado en la computadora de quien
# publica), la lista SHA256SUMS firmada y recién entonces la publica: el actualizador de Hilvan
# solo instala versiones con esa firma.
name: Publicar versión

on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.10"

jobs:
  linux:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64, deb: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64, deb: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "${{ env.GO_VERSION }}" }
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev libwebkitgtk-6.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev
      - name: Compilar
        run: |
          V="${GITHUB_REF_NAME#v}"
          for kind in tar deb; do
            CGO_ENABLED=1 go build -trimpath -tags goolm,sqlite_fts5 \
              -ldflags "-s -w -X main.version=$V -X main.packaging=$kind" -o build/$kind/hilvan ./cmd/hilvan
          done
      - name: Empaquetar .tar.gz y .deb
        run: |
          V="${GITHUB_REF_NAME#v}"
          d=hilvan-$V-linux-${{ matrix.arch }}
          mkdir -p dist $d/icons
          cp build/tar/hilvan assets/io.github.heelxel.Hilvan.desktop packaging/linux/instalar.sh $d/
          cp assets/icons/hilvan-*.png $d/icons/
          tar -czf dist/$d.tar.gz $d
          r=deb/hilvan_${V}_${{ matrix.deb }}
          install -Dm755 build/deb/hilvan $r/usr/bin/hilvan
          install -Dm644 assets/io.github.heelxel.Hilvan.desktop $r/usr/share/applications/io.github.heelxel.Hilvan.desktop
          install -Dm644 assets/logo.svg $r/usr/share/icons/hicolor/scalable/apps/io.github.heelxel.Hilvan.svg
          for s in 16 32 48 64 128 256 512; do install -Dm644 assets/icons/hilvan-$s.png $r/usr/share/icons/hicolor/${s}x${s}/apps/io.github.heelxel.Hilvan.png; done
          mkdir -p $r/DEBIAN
          cat > $r/DEBIAN/control <<CTRL
          Package: hilvan
          Version: $V
          Architecture: ${{ matrix.deb }}
          Maintainer: Hilvan <noreply@github.com>
          Depends: libgtk-4-1, libwebkitgtk-6.0-4, glib-networking, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-nice, gstreamer1.0-libav
          Recommends: gstreamer1.0-pipewire, xdg-desktop-portal
          Section: net
          Priority: optional
          Homepage: https://github.com/${{ github.repository }}
          Description: Cliente Matrix minimalista, rápido y seguro
           Mensajería con cifrado de extremo a extremo, llamadas y multicuenta.
          CTRL
          sed -i 's/^          //' $r/DEBIAN/control
          dpkg-deb --root-owner-group --build $r dist/hilvan_${V}_${{ matrix.deb }}.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "linux-${{ matrix.arch }}", path: dist/* }

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "${{ env.GO_VERSION }}" }
      - name: Preparar (dependencias incluidas y versión)
        run: |
          go mod vendor
          sed -i "s/@VERSION@/${GITHUB_REF_NAME#v}/g" packaging/flatpak/io.github.heelxel.Hilvan.yml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: hilvan.flatpak
          manifest-path: packaging/flatpak/io.github.heelxel.Hilvan.yml
          upload-artifact: false
      - name: Renombrar
        run: mkdir -p dist && mv hilvan.flatpak "dist/hilvan-${GITHUB_REF_NAME#v}-x86_64.flatpak"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: flatpak, path: dist/* }

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with: { msystem: UCRT64, install: "mingw-w64-ucrt-x86_64-gcc zip", path-type: inherit }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "${{ env.GO_VERSION }}" }
      - name: Ícono y manifiesto de Windows
        run: |
          go run github.com/tc-hib/go-winres@v0.3.3 simply --icon assets/icons/hilvan-256.png --manifest gui \
            --product-name Hilvan --file-description "Hilvan" --product-version "${GITHUB_REF_NAME#v}" --file-version "${GITHUB_REF_NAME#v}" \
            --out cmd/hilvan/rsrc
      - name: Compilar
        run: |
          V="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=1 go build -trimpath -tags goolm,sqlite_fts5 \
            -ldflags "-s -w -H windowsgui -X main.version=$V -X main.packaging=windows" -o build/hilvan.exe ./cmd/hilvan
          mkdir -p dist && (cd build && zip -9 ../dist/hilvan-$V-windows-x86_64.zip hilvan.exe)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: windows, path: dist/* }

  macos:
    strategy:
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "${{ env.GO_VERSION }}" }
      - name: Compilar y armar Hilvan.app
        run: |
          V="${GITHUB_REF_NAME#v}"
          app=build/Hilvan.app/Contents
          mkdir -p $app/MacOS $app/Resources
          CGO_ENABLED=1 go build -trimpath -tags goolm,sqlite_fts5 \
            -ldflags "-s -w -X main.version=$V -X main.packaging=macos" -o $app/MacOS/hilvan ./cmd/hilvan
          sed "s/@VERSION@/$V/g" packaging/macos/Info.plist > $app/Info.plist
          set=build/hilvan.iconset; mkdir -p $set
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icons/hilvan-512.png --out $set/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); [ $d -le 512 ] && sips -z $d $d assets/icons/hilvan-512.png --out $set/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns $set -o $app/Resources/hilvan.icns
          codesign --force --deep --sign - build/Hilvan.app
          mkdir -p dist && ditto -c -k --keepParent build/Hilvan.app dist/hilvan-$V-macos-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "macos-${{ matrix.arch }}", path: dist/* }

  borrador:
    needs: [ linux, flatpak, windows, macos ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          name: Hilvan ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
